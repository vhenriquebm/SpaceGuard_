version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: spaceguard_db
    environment:
      POSTGRES_DB: spaceguard
      POSTGRES_USER: spaceguard
      POSTGRES_PASSWORD: spaceguard123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
