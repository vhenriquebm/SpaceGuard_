server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/spaceguard
    username: spaceguard
    password: spaceguard123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: SpaceGuardSecretKey2024SuperSecretKeyForJWTHS256Algorithm32Chars
    expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
